apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: easyshop-ingress
  namespace: easyshop
  annotations:
    alb.ingress.kubernetes.io/group.name: easyshop
    # Catch-all /* must sort LAST on the shared ALB, or it shadows the dashboard
    # subpath rules (/grafana, /kibana, ...). High order = lowest priority.
    alb.ingress.kubernetes.io/group.order: '100'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    # Subnets are auto-discovered: the VPC's public subnets are tagged
    # kubernetes.io/role/elb (see terraform/vpc.tf), so the controller finds them
    # on its own — no explicit subnet pinning needed.
    # HTTP-only: no ACM cert / custom domain yet, so the app is served over HTTP at the
    # ALB's auto-generated DNS name. To add HTTPS later: own a domain, request an ACM
    # cert (ap-south-1), then add certificate-arn + HTTPS listener + ssl-redirect + host.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    kubernetes.io/ingress.class: alb
spec:
  rules:
  # No host match — serve on any hostname (the ALB's generated DNS name).
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: easyshop-service
            port:
              number: 80

