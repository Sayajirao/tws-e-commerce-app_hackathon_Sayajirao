apiVersion: v1
kind: ConfigMap
metadata:
  name: easyshop-config
  namespace: easyshop
# NOTE (replica): secrets removed from this ConfigMap. The original repo committed
# real NEXTAUTH_SECRET / JWT_SECRET values here in plaintext — a secret leak. Those
# now live ONLY in 05-secrets.yaml (and are injected via secretRef in the Deployment).
# TODO: replace the devopsdock.site domain with your own before applying.
data:
  MONGODB_URI: "mongodb://mongodb-service:27017/easyshop"
  NODE_ENV: "production"
  NEXT_PUBLIC_API_URL: "https://easyshop.devopsdock.site/api"
  NEXTAUTH_URL: "https://easyshop.devopsdock.site/"
