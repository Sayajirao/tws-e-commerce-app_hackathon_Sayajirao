apiVersion: v1
kind: Secret
metadata:
  name: easyshop-secrets
  namespace: easyshop
type: Opaque
stringData:
  # Placeholders only — real random values are applied live on the cluster (and NOT
  # committed). Generate + apply your own before deploying, e.g.:
  #   kubectl -n easyshop create secret generic easyshop-secrets \
  #     --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
  #     --from-literal=NEXTAUTH_SECRET=$(openssl rand -hex 32) \
  #     --dry-run=client -o yaml | kubectl apply -f -
  JWT_SECRET: "change-this-in-production"
  NEXTAUTH_SECRET: "change-this-in-production"